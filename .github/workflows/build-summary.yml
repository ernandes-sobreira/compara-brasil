name: Build complete legislative summary

on:
  push:
    paths:
      - ".github/workflows/build-summary.yml"
      - "scripts/build-summary.mjs"
  schedule:
    - cron: "17 9 * * 1"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm init -y
      - run: npm install firebase@12
      - run: node scripts/build-summary.mjs
      - name: Commit summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dados/resumo-completo.json
          git commit -m "Update complete legislative summary" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
